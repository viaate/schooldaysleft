<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>May 2025 Countdown</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 2rem;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1.5rem;
    }
    p {
      font-size: 1.1rem;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Countdown to End of School</h1>
    <p id="daysLeft"></p>
    <p id="weekdaysLeft"></p>
    <p id="weeksLeft"></p>
  </div>

  <script>
    const scheduleDates = [
      "2025-05-01", "2025-05-02", "2025-05-05", "2025-05-06", "2025-05-07",
      "2025-05-08", "2025-05-09", "2025-05-12", "2025-05-13", "2025-05-14",
      "2025-05-15", "2025-05-16", "2025-05-20", "2025-05-21"
    ];

    const today = new Date();
    const endDate = new Date("2025-05-23");

    // Days left including weekends
    const daysLeft = Math.max(0, Math.ceil((endDate - today) / (1000 * 60 * 60 * 24)) + 1);

    // Weekdays left
    const weekdaysLeft = scheduleDates.filter(dateStr => {
      const d = new Date(dateStr);
      return d >= today;
    }).length;

    // Weeks left (based on calendar week numbers)
    const weeksSet = new Set(
      scheduleDates.filter(dateStr => new Date(dateStr) >= today).map(dateStr => {
        const d = new Date(dateStr);
        return `${d.getFullYear()}-W${String(getWeekNumber(d)).padStart(2, '0')}`;
      })
    );

    const weeksLeft = weeksSet.size;

    function getWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    document.getElementById("daysLeft").textContent = `Days left (including weekends): ${daysLeft}`;
    document.getElementById("weekdaysLeft").textContent = `Weekdays with school left: ${weekdaysLeft}`;
    document.getElementById("weeksLeft").textContent = `Weeks left: ${weeksLeft}`;
  </script>
</body>
</html>
